
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <meta name="theme-color" content="#718b80">
  <title>Blood&amp;Brioche | Fórum</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="desktop">

    <header class="top-strip" aria-label="Cabeçalho">
      <div class="top-metal"></div>
      <div class="top-controls">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </header>

    <div class="shell">

      <!-- BARRA LATERAL ESQUERDA -->
      <aside class="sidebar" aria-label="Navegação">

        <div class="module-caption">Navegação</div>

        <div class="orb-wrap">
          <div class="orb">
            <div class="orb-core">
            </div>
          </div>
        </div>

        <nav class="navigation">
          <a class="nav-button selected"
             href="index.html"
             aria-current="page">Início</a>

          <a class="nav-button" href="#" aria-disabled="true">Posts</a>
          <a class="nav-button" href="#" aria-disabled="true">Vídeos</a>
          <a class="nav-button" href="#" aria-disabled="true">Imagens</a>
          <a class="nav-button" href="#" aria-disabled="true">Sobre</a>
          <a class="nav-button" href="#" aria-disabled="true">Regras</a>
          <a class="nav-button" href="#" aria-disabled="true">Blog</a>
        </nav>

        <div class="sidebar-bottom">
          <div class="small-lights">
            <i></i>
            <i></i>
            <i></i>
          </div>
          </div>

      </aside>

      <!-- PAINEL PRINCIPAL -->
      <main class="main-panel">

        <div class="window-title">
          <span class="window-indicator"></span>
          Ínicio

          <div class="window-actions">
            <span>_</span>
            <span>□</span>
            <span>×</span>
          </div>
        </div>

        <!-- BANNER -->
        <section class="hero" aria-label="Boas-vindas">

          <div class="hero-inner">
  <img
    src="cherie.png"
    alt="Chérie"
    class="site-logo"
  >
  <div class="hero-rule"></div>
</div>

          <div class="hero-circles" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>

        </section>

        <div class="panel-separator">
          <span>Início para visitantes</span>
        </div>

        <!-- PÁGINA INICIAL -->
        <section class="welcome-window" aria-label="Página inicial">

          <div class="welcome-heading">
            Olá, bem-vindo (a) ao site
          </div>

          <div class="empty-area">

            <img
              src="lied.cherie.png"
              alt="Gatinha deitada"
              class="cherie-image"
            >

            <p>
              Nada irá aparecer nada aqui porque você não está logado em uma conta.
            </p>

          </div>

        </section>

        <div class="bottom-controls">
          <span class="round-led"></span>
          <span>Made by Eloyse</span>

          <div class="decorative-bars">
            <i></i>
            <i></i>
            <i></i>
          </div>
        </div>

      </main>

      <!-- BARRA LATERAL DIREITA -->
      <aside class="right-rail" aria-label="Painel de acesso">

        <div class="rail-top">
          <div class="large-dial">
            <div class="dial-inside"></div>
          </div>
          <span>Controle</span>
        </div>

        <div class="rail-meter">
           <span>Pessoas aqui agora:</span>
 <strong data-online-count aria-live="polite">—</strong>
         <div class="meter-fill"></div>
        </div>

        <div class="rail-bars">
          <i></i>
          <i></i>
          <i></i>
          <i></i>
        </div>

        <div class="rail-section-title">
          Conta
        </div>

        <a class="account-button" href="cadastro.html">
  Realize o cadastro
</a>

        <a class="account-button" href="login.html" aria-disabled="true">
          Faça o login
        </a>

        <div class="rail-dial">
          <div></div>
        </div>

        <div class="rail-footer">
          Gatorade
        </div>

      </aside>

    </div>

    <!-- RODAPÉ -->
    <footer class="taskbar"><div class="start-mark"class="task-fill"></div></footer>

  </div>
<script src="presenca.js" defer></script>
</body>
</html>
